services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-launcher}
      POSTGRES_USER: ${POSTGRES_USER:-launcher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18 stores data below a versioned subdirectory under this
      # parent mount, which also keeps pg_upgrade usable across major versions.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://launcher:change-me@postgres:5432/launcher}
      LAUNCHER_BIND: ${LAUNCHER_BIND:-0.0.0.0:8080}
      LAUNCHER_PUBLIC_BASE_URL: ${LAUNCHER_PUBLIC_BASE_URL:-http://localhost}
      LAUNCHER_OPERATOR_TOKEN: ${LAUNCHER_OPERATOR_TOKEN:-}
      LAUNCHER_OPERATOR_AUTH_REQUIRED: ${LAUNCHER_OPERATOR_AUTH_REQUIRED:-false}
      LAUNCHER_STORAGE_ROOT: /var/lib/launcher/storage
      LAUNCHER_STORAGE_PROVIDERS: ${LAUNCHER_STORAGE_PROVIDERS:-local}
      LAUNCHER_LOCAL_TIER: ${LAUNCHER_LOCAL_TIER:-HOT}
      LAUNCHER_MIRROR_BASE_URLS: ${LAUNCHER_MIRROR_BASE_URLS:-}
      LAUNCHER_STORAGE_MIN_HOT_REPLICAS: ${LAUNCHER_STORAGE_MIN_HOT_REPLICAS:-1}
      LAUNCHER_STORAGE_MIN_COLD_REPLICAS: ${LAUNCHER_STORAGE_MIN_COLD_REPLICAS:-0}
      LAUNCHER_STORAGE_MIN_ARCHIVE_REPLICAS: ${LAUNCHER_STORAGE_MIN_ARCHIVE_REPLICAS:-0}
      LAUNCHER_STORAGE_MIN_HOT_FAILURE_DOMAINS: ${LAUNCHER_STORAGE_MIN_HOT_FAILURE_DOMAINS:-1}
      LAUNCHER_STORAGE_MIN_COLD_FAILURE_DOMAINS: ${LAUNCHER_STORAGE_MIN_COLD_FAILURE_DOMAINS:-0}
      LAUNCHER_STORAGE_MIN_ARCHIVE_FAILURE_DOMAINS: ${LAUNCHER_STORAGE_MIN_ARCHIVE_FAILURE_DOMAINS:-0}
      LAUNCHER_STORAGE_PREFERRED_HOT_REPLICAS: ${LAUNCHER_STORAGE_PREFERRED_HOT_REPLICAS:-1}
      LAUNCHER_STORAGE_PREFERRED_COLD_REPLICAS: ${LAUNCHER_STORAGE_PREFERRED_COLD_REPLICAS:-0}
      LAUNCHER_STORAGE_PREFERRED_ARCHIVE_REPLICAS: ${LAUNCHER_STORAGE_PREFERRED_ARCHIVE_REPLICAS:-0}
      LAUNCHER_STORAGE_COLD_BACKUP_REQUIRED: ${LAUNCHER_STORAGE_COLD_BACKUP_REQUIRED:-false}
      LAUNCHER_STORAGE_RESTORE_MODE: ${LAUNCHER_STORAGE_RESTORE_MODE:-ON_DEMAND}
      LAUNCHER_RESTORE_TARGET_PROVIDER: ${LAUNCHER_RESTORE_TARGET_PROVIDER:-local}
      LAUNCHER_S3_PROVIDER_ID: ${LAUNCHER_S3_PROVIDER_ID:-s3-hot}
      LAUNCHER_S3_TIER: ${LAUNCHER_S3_TIER:-HOT}
      LAUNCHER_S3_ENDPOINT: ${LAUNCHER_S3_ENDPOINT:-}
      LAUNCHER_S3_REGION: ${LAUNCHER_S3_REGION:-}
      LAUNCHER_S3_BUCKET: ${LAUNCHER_S3_BUCKET:-}
      LAUNCHER_S3_ACCESS_KEY: ${LAUNCHER_S3_ACCESS_KEY:-}
      LAUNCHER_S3_SECRET_KEY: ${LAUNCHER_S3_SECRET_KEY:-}
      LAUNCHER_S3_SESSION_TOKEN: ${LAUNCHER_S3_SESSION_TOKEN:-}
      LAUNCHER_S3_PUBLIC_BASE_URL: ${LAUNCHER_S3_PUBLIC_BASE_URL:-}
      LAUNCHER_S3_PRESIGN_TTL_SECONDS: ${LAUNCHER_S3_PRESIGN_TTL_SECONDS:-900}
      LAUNCHER_S3_MULTIPART_THRESHOLD_BYTES: ${LAUNCHER_S3_MULTIPART_THRESHOLD_BYTES:-8388608}
      LAUNCHER_S3_MULTIPART_PART_BYTES: ${LAUNCHER_S3_MULTIPART_PART_BYTES:-8388608}
      LAUNCHER_S3_ORPHAN_MAX_AGE_SECONDS: ${LAUNCHER_S3_ORPHAN_MAX_AGE_SECONDS:-86400}
      LAUNCHER_S3_MAX_ATTEMPTS: ${LAUNCHER_S3_MAX_ATTEMPTS:-4}
      LAUNCHER_S3_MAX_CONCURRENT_REQUESTS: ${LAUNCHER_S3_MAX_CONCURRENT_REQUESTS:-4}
      LAUNCHER_S3_FORCE_PATH_STYLE: ${LAUNCHER_S3_FORCE_PATH_STYLE:-true}
      LAUNCHER_AUTO_MIGRATE: ${LAUNCHER_AUTO_MIGRATE:-0}
      PROVISIONING_ENABLED: ${PROVISIONING_ENABLED:-false}
      PROVISIONING_EMAIL_DOMAIN: ${PROVISIONING_EMAIL_DOMAIN:-vaultnode.pp.ua}
      PROVISIONING_EMAIL_INGEST_HMAC_SECRET: ${PROVISIONING_EMAIL_INGEST_HMAC_SECRET:-}
      PROVISIONING_EMAIL_MAX_BYTES: ${PROVISIONING_EMAIL_MAX_BYTES:-5242880}
      PROVISIONING_EMAIL_ALLOWED_CLOCK_SKEW_SECONDS: ${PROVISIONING_EMAIL_ALLOWED_CLOCK_SKEW_SECONDS:-300}
      PROVISIONING_MAIL_ALIAS_TTL_SECONDS: ${PROVISIONING_MAIL_ALIAS_TTL_SECONDS:-3600}
      PROVISIONING_DEFAULT_MODE: ${PROVISIONING_DEFAULT_MODE:-MANUAL}
      PROVISIONING_CAPACITY_HEADROOM_BYTES: ${PROVISIONING_CAPACITY_HEADROOM_BYTES:-0}
      PROVISIONING_SECRET_STORE_DIR: /var/lib/launcher/provisioning-secrets
      PROVISIONING_TEMP_DIR: /tmp/launcher-cold
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - launcher-storage:/var/lib/launcher/storage

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  postgres-data:
  launcher-storage:
  caddy-data:
  caddy-config:
