services:
  api:
    env_file:
      - ../secrets/telegram.env
    environment:
      LAUNCHER_STORAGE_PROVIDERS: filemirage,telegram
      LAUNCHER_FILEMIRAGE_STATE_FILE: /var/lib/launcher/storage/filemirage-state.json
      LAUNCHER_RESTORE_TARGET_PROVIDER: filemirage
      LAUNCHER_OPERATOR_AUTH_REQUIRED: "true"
      LAUNCHER_OPERATOR_TOKEN: ${LAUNCHER_OPERATOR_TOKEN:?set LAUNCHER_OPERATOR_TOKEN in .env}
      LAUNCHER_TRUST_PROXY_HEADERS: "true"
      LAUNCHER_SIGNING_REQUIRE_EXTERNAL_KEY: "true"
      TELEGRAM_COLD_ENABLED: "true"
      TELEGRAM_BOT_API_BASE_URL: http://telegram-bot-api-proxy:8081
      TELEGRAM_COLD_MAX_UPLOAD_BYTES: "536870912"
      TELEGRAM_COLD_STATE_FILE: /var/lib/launcher/storage/telegram-cold-state.json
      PACK_STORAGE_ENABLED: "true"
      LAUNCHER_PACK_COLD_ONLY: "true"
      LAUNCHER_PACK_CANONICAL: "true"
      LAUNCHER_HOT_RENEWAL_DAYS: "18"
      LAUNCHER_HOT_RENEWAL_PROVIDER_TYPES: filemirage
      LAUNCHER_HOT_RENEWAL_BATCH: "4"
      LAUNCHER_STORAGE_MIN_COLD_REPLICAS: "1"
      LAUNCHER_STORAGE_PREFERRED_COLD_REPLICAS: "1"
      LAUNCHER_STORAGE_MIN_COLD_FAILURE_DOMAINS: "1"
      LAUNCHER_STORAGE_COLD_BACKUP_REQUIRED: "true"
      LAUNCHER_STORAGE_RESTORE_MODE: ON_DEMAND
      LAUNCHER_COLD_STREAM_WORKER_URL: http://worker:8081
      LAUNCHER_COLD_STREAM_TOKEN: ${LAUNCHER_COLD_STREAM_TOKEN:?set LAUNCHER_COLD_STREAM_TOKEN in .env}
    depends_on:
      telegram-bot-api-proxy:
        condition: service_started

  worker:
    env_file:
      - ../secrets/telegram.env
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LAUNCHER_STORAGE_ROOT: /var/lib/launcher/storage
      LAUNCHER_STORAGE_PROVIDERS: filemirage,telegram
      LAUNCHER_FILEMIRAGE_STATE_FILE: /var/lib/launcher/storage/filemirage-state.json
      LAUNCHER_RESTORE_TARGET_PROVIDER: filemirage
      LAUNCHER_OPERATOR_AUTH_REQUIRED: "true"
      LAUNCHER_SIGNING_PRIVATE_KEY_PATH: /run/secrets/mantle-signing-key.pem
      LAUNCHER_SIGNING_REQUIRE_EXTERNAL_KEY: "true"
      LAUNCHER_AUTO_MIGRATE: "0"
      TELEGRAM_COLD_ENABLED: "true"
      TELEGRAM_BOT_API_BASE_URL: http://telegram-bot-api-proxy:8081
      TELEGRAM_COLD_MAX_UPLOAD_BYTES: "536870912"
      TELEGRAM_COLD_STATE_FILE: /var/lib/launcher/storage/telegram-cold-state.json
      PACK_STORAGE_ENABLED: "true"
      LAUNCHER_PACK_COLD_ONLY: "true"
      LAUNCHER_PACK_CANONICAL: "true"
      LAUNCHER_HOT_RENEWAL_DAYS: "18"
      LAUNCHER_HOT_RENEWAL_PROVIDER_TYPES: filemirage
      LAUNCHER_HOT_RENEWAL_BATCH: "4"
      LAUNCHER_STORAGE_MIN_COLD_REPLICAS: "1"
      LAUNCHER_STORAGE_PREFERRED_COLD_REPLICAS: "1"
      LAUNCHER_STORAGE_MIN_COLD_FAILURE_DOMAINS: "1"
      LAUNCHER_STORAGE_COLD_BACKUP_REQUIRED: "true"
      LAUNCHER_STORAGE_RESTORE_MODE: ON_DEMAND
      LAUNCHER_COLD_STREAM_TOKEN: ${LAUNCHER_COLD_STREAM_TOKEN:?set LAUNCHER_COLD_STREAM_TOKEN in .env}
    command: ["storage", "worker", "--poll-seconds", "15", "--storage-root", "/var/lib/launcher/storage"]
    depends_on:
      postgres:
        condition: service_healthy
      telegram-bot-api-proxy:
        condition: service_started
    volumes:
      - launcher-storage:/var/lib/launcher/storage
      - ../secrets/mantle-2026-08-14.private.pem:/run/secrets/mantle-signing-key.pem:ro

  telegram-bot-api:
    build:
      context: ..
      dockerfile: deploy/telegram-bot-api.Dockerfile
      args:
        TELEGRAM_BOT_API_BUILD_PARALLELISM: "2"
    restart: unless-stopped
    env_file:
      - ../secrets/telegram-api.env
    environment:
      PORT: "8081"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    tmpfs:
      - /tmp/telegram-bot-api:size=2g,mode=1777

  telegram-bot-api-proxy:
    build:
      context: ..
      dockerfile: deploy/telegram-bot-api-file-proxy-local.Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8081"
      TELEGRAM_BOT_API_UPSTREAM_HOST: telegram-bot-api
      TELEGRAM_LOCAL_API_PORT: "8081"
    depends_on:
      telegram-bot-api:
        condition: service_started
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api:ro

  caddy:
    volumes:
      - ./VpsCaddyfile:/etc/caddy/Caddyfile:ro

volumes:
  telegram-bot-api-data:
