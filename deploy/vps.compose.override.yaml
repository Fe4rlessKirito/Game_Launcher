services:
  postgres:
    mem_limit: ${LAUNCHER_POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${LAUNCHER_POSTGRES_CPUS:-2.0}
    pids_limit: ${LAUNCHER_POSTGRES_PIDS_LIMIT:-256}

  api:
    mem_limit: ${LAUNCHER_API_MEMORY_LIMIT:-768m}
    cpus: ${LAUNCHER_API_CPUS:-2.0}
    pids_limit: ${LAUNCHER_API_PIDS_LIMIT:-256}
    env_file:
      - ../secrets/telegram.env
    environment:
      # Mantle keeps provider indexes and work-status metadata on disk, but
      # all launcher content/staging bytes live in the shared RAM-backed
      # volume below and are never written to the VPS disk.
      LAUNCHER_STORAGE_ROOT: /var/lib/launcher/ephemeral
      LAUNCHER_STORAGE_PROVIDERS: filemirage,telegram
      LAUNCHER_WORK_STATUS_DIR: /var/lib/launcher/storage/work-status
      LAUNCHER_WORK_STATUS_STALE_SECONDS: "900"
      LAUNCHER_FILEMIRAGE_STATE_FILE: /var/lib/launcher/storage/filemirage-state.json
      LAUNCHER_RESTORE_TARGET_PROVIDER: filemirage
      LAUNCHER_OPERATOR_AUTH_REQUIRED: "true"
      LAUNCHER_OPERATOR_TOKEN: ${LAUNCHER_OPERATOR_TOKEN:?set LAUNCHER_OPERATOR_TOKEN in .env}
      LAUNCHER_STEAM_WEB_API_KEY: ${LAUNCHER_STEAM_WEB_API_KEY:-}
      LAUNCHER_TRUST_PROXY_HEADERS: "true"
      LAUNCHER_SIGNING_REQUIRE_EXTERNAL_KEY: "true"
      TELEGRAM_COLD_ENABLED: "true"
      TELEGRAM_BOT_API_BASE_URL: http://telegram-bot-api-proxy:8081
      TELEGRAM_COLD_MAX_UPLOAD_BYTES: "536870912"
      TELEGRAM_COLD_STATE_FILE: /var/lib/launcher/storage/telegram-cold-state.json
      PACK_STORAGE_ENABLED: "true"
      LAUNCHER_PACK_COLD_ONLY: "true"
      LAUNCHER_PACK_CANONICAL: "true"
      LAUNCHER_HOT_RENEWAL_DAYS: "18"
      LAUNCHER_HOT_RENEWAL_PROVIDER_TYPES: filemirage
      LAUNCHER_HOT_RENEWAL_BATCH: "4"
      LAUNCHER_STORAGE_MIN_COLD_REPLICAS: "1"
      LAUNCHER_STORAGE_PREFERRED_COLD_REPLICAS: "1"
      LAUNCHER_STORAGE_MIN_COLD_FAILURE_DOMAINS: "1"
      LAUNCHER_STORAGE_COLD_BACKUP_REQUIRED: "true"
      LAUNCHER_STORAGE_RESTORE_MODE: ON_DEMAND
      LAUNCHER_COLD_STREAM_WORKER_URL: http://worker:8081
      LAUNCHER_COLD_STREAM_TOKEN: ${LAUNCHER_COLD_STREAM_TOKEN:?set LAUNCHER_COLD_STREAM_TOKEN in .env}
    depends_on:
      telegram-bot-api-proxy:
        condition: service_started
    volumes:
      - launcher-storage:/var/lib/launcher/storage
      - launcher-ephemeral-content:/var/lib/launcher/ephemeral

  worker:
    env_file:
      - ../secrets/telegram.env
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    restart: unless-stopped
    mem_limit: ${LAUNCHER_WORKER_MEMORY_LIMIT:-2g}
    cpus: ${LAUNCHER_WORKER_CPUS:-4.0}
    pids_limit: ${LAUNCHER_WORKER_PIDS_LIMIT:-512}
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LAUNCHER_STORAGE_ROOT: /var/lib/launcher/ephemeral
      LAUNCHER_WORK_STATUS_DIR: /var/lib/launcher/storage/work-status
      LAUNCHER_WORK_STATUS_STALE_SECONDS: "900"
      LAUNCHER_STORAGE_PROVIDERS: filemirage,telegram
      LAUNCHER_FILEMIRAGE_STATE_FILE: /var/lib/launcher/storage/filemirage-state.json
      LAUNCHER_RESTORE_TARGET_PROVIDER: filemirage
      LAUNCHER_SIGNING_PRIVATE_KEY_PATH: /run/secrets/mantle-signing-key.pem
      LAUNCHER_SIGNING_REQUIRE_EXTERNAL_KEY: "true"
      LAUNCHER_AUTO_MIGRATE: "0"
      TELEGRAM_COLD_ENABLED: "true"
      TELEGRAM_BOT_API_BASE_URL: http://telegram-bot-api-proxy:8081
      TELEGRAM_COLD_MAX_UPLOAD_BYTES: "536870912"
      TELEGRAM_COLD_STATE_FILE: /var/lib/launcher/storage/telegram-cold-state.json
      PACK_STORAGE_ENABLED: "true"
      LAUNCHER_PACK_COLD_ONLY: "true"
      LAUNCHER_PACK_CANONICAL: "true"
      LAUNCHER_HOT_RENEWAL_DAYS: "18"
      LAUNCHER_HOT_RENEWAL_PROVIDER_TYPES: filemirage
      LAUNCHER_HOT_RENEWAL_BATCH: "4"
      LAUNCHER_STORAGE_MIN_COLD_REPLICAS: "1"
      LAUNCHER_STORAGE_PREFERRED_COLD_REPLICAS: "1"
      LAUNCHER_STORAGE_MIN_COLD_FAILURE_DOMAINS: "1"
      LAUNCHER_STORAGE_COLD_BACKUP_REQUIRED: "true"
      LAUNCHER_STORAGE_RESTORE_MODE: ON_DEMAND
      LAUNCHER_COLD_STREAM_TOKEN: ${LAUNCHER_COLD_STREAM_TOKEN:?set LAUNCHER_COLD_STREAM_TOKEN in .env}
      LAUNCHER_COLD_STREAM_MAX_CONCURRENT: ${LAUNCHER_COLD_STREAM_MAX_CONCURRENT:-8}
      LAUNCHER_CLEANUP_STAGING_AFTER_PUBLISH: "true"
    command: ["storage", "worker", "--poll-seconds", "15", "--storage-root", "/var/lib/launcher/ephemeral"]
    depends_on:
      postgres:
        condition: service_healthy
      telegram-bot-api-proxy:
        condition: service_started
    volumes:
      - launcher-storage:/var/lib/launcher/storage
      - launcher-ephemeral-content:/var/lib/launcher/ephemeral
      - ../secrets/mantle-2026-08-14.private.pem:/run/secrets/mantle-signing-key.pem:ro

  scraper:
    build:
      context: ..
      dockerfile: deploy/scraper.Dockerfile
    restart: unless-stopped
    mem_limit: ${LAUNCHER_SCRAPER_MEMORY_LIMIT:-1g}
    cpus: ${LAUNCHER_SCRAPER_CPUS:-2.0}
    pids_limit: ${LAUNCHER_SCRAPER_PIDS_LIMIT:-256}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - ../secrets/scraper.env
    environment:
      SCRAPER_ENABLED: "true"
      SCRAPER_STATE_DB: /var/lib/launcher/storage/scraper/scraper-state.db
      SCRAPER_OUTPUT_DIR: /var/lib/launcher/ephemeral/scraper/artifacts
      SCRAPER_STATUS_DIR: /var/lib/launcher/storage/work-status
      SCRAPER_BROWSER: http
      SCRAPER_ALLOW_LOCALHOST: "false"
      # Keep the combined extraction and artifact ceilings below the 8 GiB
      # RAM-backed staging volume. Raise these only with the volume and
      # container memory ceilings together.
      SCRAPER_MAX_ARTIFACT_BYTES: ${SCRAPER_MAX_ARTIFACT_BYTES:-4294967296}
      SCRAPER_MAX_ARCHIVE_ENTRIES: ${SCRAPER_MAX_ARCHIVE_ENTRIES:-200000}
      SCRAPER_MAX_ARCHIVE_BYTES: ${SCRAPER_MAX_ARCHIVE_BYTES:-4294967296}
      SCRAPER_MAX_ARCHIVE_FILE_BYTES: ${SCRAPER_MAX_ARCHIVE_FILE_BYTES:-2147483648}
      SCRAPER_TEMP_MAX_BYTES: ${SCRAPER_TEMP_MAX_BYTES:-3221225472}
    command: ["--store", "/var/lib/launcher/storage/scraper/scraper-state.db", "--output-root", "/var/lib/launcher/ephemeral/scraper/artifacts", "worker", "--poll-seconds", "15"]
    volumes:
      - launcher-storage:/var/lib/launcher/storage
      - launcher-ephemeral-content:/var/lib/launcher/ephemeral
    networks:
      - scraper-egress

  telegram-bot-api:
    build:
      context: ..
      dockerfile: deploy/telegram-bot-api.Dockerfile
      args:
        TELEGRAM_BOT_API_BUILD_PARALLELISM: "2"
    restart: unless-stopped
    mem_limit: ${LAUNCHER_TELEGRAM_API_MEMORY_LIMIT:-1g}
    cpus: ${LAUNCHER_TELEGRAM_API_CPUS:-2.0}
    pids_limit: ${LAUNCHER_TELEGRAM_API_PIDS_LIMIT:-256}
    env_file:
      - ../secrets/telegram-api.env
    environment:
      PORT: "8081"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    tmpfs:
      - /tmp/telegram-bot-api:size=2g,mode=1777

  telegram-bot-api-proxy:
    build:
      context: ..
      dockerfile: deploy/telegram-bot-api-file-proxy-local.Dockerfile
    restart: unless-stopped
    mem_limit: ${LAUNCHER_TELEGRAM_PROXY_MEMORY_LIMIT:-256m}
    cpus: ${LAUNCHER_TELEGRAM_PROXY_CPUS:-1.0}
    pids_limit: ${LAUNCHER_TELEGRAM_PROXY_PIDS_LIMIT:-128}
    environment:
      PORT: "8081"
      TELEGRAM_BOT_API_UPSTREAM_HOST: telegram-bot-api
      TELEGRAM_LOCAL_API_PORT: "8081"
    depends_on:
      telegram-bot-api:
        condition: service_started
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api:ro

  caddy:
    mem_limit: ${LAUNCHER_CADDY_MEMORY_LIMIT:-256m}
    cpus: ${LAUNCHER_CADDY_CPUS:-1.0}
    pids_limit: ${LAUNCHER_CADDY_PIDS_LIMIT:-128}
    volumes:
      - ./VpsCaddyfile:/etc/caddy/Caddyfile:ro
      - ../website/dist:/srv/vaultnode-website:ro

volumes:
  # Shared only between API/worker; this is a RAM-backed staging area, not a
  # durable game library. Provider data lives outside Mantle on FileMirage
  # and Telegram.
  launcher-ephemeral-content:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=8g,mode=1777
  telegram-bot-api-data:

networks:
  # The scraper needs outbound internet access but never needs to resolve or
  # connect to the API, worker, database, or Telegram services. Keeping it on
  # a separate network narrows the impact of an SSRF or browser escape.
  scraper-egress:
    driver: bridge
