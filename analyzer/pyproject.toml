[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "launcher-analyzer"
version = "0.1.0"
description = "Deterministic analyzer for authorized game build directories"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
binary = ["lief>=0.17.6"]
dev = ["pytest>=8.4", "ruff>=0.12", "mypy>=1.17"]

[project.scripts]
launcher-analyzer = "launcher_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
