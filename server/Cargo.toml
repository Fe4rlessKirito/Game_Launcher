[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/common",
    "crates/database",
    "crates/domain",
    "crates/manifests",
    "crates/packager",
    "crates/storage",
    "crates/worker",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
authors = ["Launcher Platform contributors"]

[workspace.dependencies]
anyhow = "1.0.98"
async-trait = "0.1.89"
axum = "0.8.9"
blake3 = "1.8.2"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.45", features = ["derive"] }
fastcdc = "4.0.1"
http = "1.3.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "uuid", "migrate"] }
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["full"] }
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.0", features = ["v4", "serde"] }
walkdir = "2.5.0"
zstd = "0.13.3"
