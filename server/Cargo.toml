[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/common",
    "crates/database",
    "crates/domain",
    "crates/manifests",
    "crates/normalizer",
    "crates/packager",
    "crates/packs",
    "crates/provisioning",
    "crates/storage",
    "crates/worker",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
authors = ["Launcher Platform contributors"]

[workspace.dependencies]
anyhow = "1.0.98"
async-trait = "0.1.89"
bytes = "1.10.1"
aws-credential-types = "1.3.0"
aws-sdk-s3 = { version = "1.141.0", default-features = false, features = ["http-1x", "rt-tokio", "rustls"] }
axum = "0.8.9"
base64 = "0.22.1"
blake3 = "1.8.2"
bzip2 = "0.6.1"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.45", features = ["derive"] }
fastcdc = "4.0.1"
futures-util = "0.3.31"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
http = "1.3.1"
hmac = "0.12.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha2 = { version = "0.10.9", features = ["oid"] }
rand = "0.8.5"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "multipart", "stream", "rustls"] }
rsa = "0.9.9"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "uuid", "migrate"] }
sevenz-rust = { version = "0.6.1", default-features = false }
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["full"] }
tower = { version = "0.5.3", features = ["limit"] }
tower-http = { version = "0.6.6", features = ["cors", "limit", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.0", features = ["v4", "serde"] }
walkdir = "2.5.0"
unrar = "0.5.8"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
zstd = "0.13.3"
