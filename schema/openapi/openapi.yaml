openapi: 3.1.0
info:
  title: Launcher Control Plane API
  version: 0.1.0
  description: Metadata and mirror resolution API. Chunk bytes are served by storage providers.
servers:
  - url: http://localhost
paths:
  /health:
    get:
      operationId: health
      responses:
        '200': { description: API is alive }
  /v1/health:
    get:
      operationId: liveness
      responses:
        '200': { description: Lightweight process liveness response }
  /v1/ready:
    get:
      operationId: readiness
      responses:
        '200': { description: API and critical database readiness }
        '503': { description: A critical dependency is not ready }
  /api/v1/public/status:
    get:
      operationId: publicStatus
      responses:
        '200':
          description: Sanitized server-side telemetry snapshot collected continuously by the API process
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicStatusResponse' }
        '503': { description: Public status dependencies are unavailable }
  /api/v1/me:
    get:
      operationId: currentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated Supabase user identity
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
                  email: { type: string, format: email, nullable: true }
        '401': { description: Missing or invalid user access token }
        '503': { description: User authentication is not configured or unavailable }
  /metrics:
    get:
      operationId: metrics
      responses:
        '200': { description: Prometheus-compatible storage and restore metrics }
  /api/v1/storage/status:
    get:
      operationId: storageStatus
      responses:
        '200': { description: Tier policy, provider health, and redacted account capacity }
  /api/v1/storage/metrics:
    get:
      operationId: storageMetrics
      responses:
        '200': { description: Prometheus-compatible storage and restore metrics }
  /api/v1/games:
    get:
      operationId: listGames
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
      responses:
        '200': { description: Published catalog page }
  /api/v1/games/{id}:
    get:
      operationId: getGame
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Game metadata }
        '404': { description: Game not found }
  /api/v1/builds/{id}/manifest:
    get:
      operationId: getManifest
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Published manifest }
        '404': { description: Manifest not found }
  /api/v1/builds/{id}/resolve:
    post:
      operationId: resolveChunks
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [encoded_hashes]
              properties:
                encoded_hashes: { type: array, maxItems: 512, items: { type: string, pattern: '^[0-9a-f]{64}$' } }
      responses:
        '200': { description: Direct storage locations }
        '503':
          description: A cold-only chunk is being restored or no hot location is available
          headers:
            Retry-After:
              schema: { type: integer }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PublicStatusResponse:
      type: object
      required: [status, database_ready, storage_configured, providers, usage, total_used_bytes, pending_restores, system, probe_interval_seconds, stale, utc]
      properties:
        status: { type: string, enum: [starting, operational, degraded] }
        database_ready: { type: boolean }
        storage_configured: { type: boolean }
        providers:
          type: array
          items:
            type: object
            required: [provider, tier, healthy]
            properties:
              provider: { type: string }
              tier: { type: string, enum: [HOT, COLD, ARCHIVE] }
              healthy: { type: boolean }
        usage:
          type: array
          items:
            type: object
            required: [provider, tier, used_bytes]
            properties:
              provider: { type: string }
              tier: { type: string, enum: [HOT, COLD, ARCHIVE] }
              used_bytes: { type: integer, format: int64, minimum: 0 }
              last_capacity_check: { type: string, format: date-time, nullable: true }
        total_used_bytes: { type: integer, format: int64, minimum: 0 }
        pending_restores: { type: integer, minimum: 0 }
        system:
          type: object
          required: [measured_at]
          properties:
            cpu_usage_percent: { type: number, format: double, minimum: 0, maximum: 100, nullable: true }
            memory_used_bytes: { type: integer, format: int64, minimum: 0, nullable: true }
            memory_total_bytes: { type: integer, format: int64, minimum: 0, nullable: true }
            disk_used_bytes: { type: integer, format: int64, minimum: 0, nullable: true }
            disk_total_bytes: { type: integer, format: int64, minimum: 0, nullable: true }
            measured_at: { type: string, format: date-time }
        last_probe_at: { type: string, format: date-time, nullable: true }
        last_successful_probe_at: { type: string, format: date-time, nullable: true }
        probe_duration_ms: { type: integer, minimum: 0, nullable: true }
        probe_interval_seconds: { type: integer, minimum: 10 }
        stale: { type: boolean }
        utc: { type: string, format: date-time }
