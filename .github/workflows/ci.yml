name: ci

on:
  push:
  pull_request:

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'
      - run: dotnet restore launcher/Launcher.sln
      - run: dotnet build launcher/Launcher.sln --configuration Release --no-restore
      # Running every test project through the solution in parallel can start
      # six test hosts at once on the Windows runner. The installation tests
      # are intentionally filesystem-heavy, so serialize the hosts to avoid
      # nondeterministic testhost OOM failures.
      - name: Run .NET tests serially
        shell: pwsh
        run: |
          $projects = @(
            'launcher/tests/Launcher.Core.Tests/Launcher.Core.Tests.csproj',
            'launcher/tests/Launcher.Manifests.Tests/Launcher.Manifests.Tests.csproj',
            'launcher/tests/Launcher.Updater.Tests/Launcher.Updater.Tests.csproj',
            'launcher/tests/Launcher.Downloads.Tests/Launcher.Downloads.Tests.csproj',
            'launcher/tests/Launcher.Installation.Tests/Launcher.Installation.Tests.csproj',
            'launcher/tests/Launcher.App.Tests/Launcher.App.Tests.csproj'
          )
          foreach ($project in $projects) {
            dotnet test $project --configuration Release --no-build --no-restore -- RunConfiguration.MaxCpuCount=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
        working-directory: server
      # Embedded PostgreSQL integration tests share a Windows runner's local
      # process and port resources; serialize test cases for deterministic CI.
      - run: cargo test --workspace -- --test-threads=1
        working-directory: server
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: server

  analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e 'analyzer[dev]'
      - run: ruff check analyzer
      - run: mypy analyzer/src
      - run: pytest analyzer/tests
      - name: Validate deployment shell script
        run: bash -n deploy/backup-postgres.sh
      - name: Validate staging PowerShell scripts
        shell: pwsh
        run: |
          $parseErrors = @()
          foreach ($script in Get-ChildItem scripts/staging -Filter '*.ps1' -File) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $parseErrors += $errors | ForEach-Object {
                "$($script.Name): $($_.Message)"
              }
            }
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Write-Error
            exit 1
          }

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - working-directory: website
        run: npm ci
      - working-directory: website
        run: npm run build

  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'
      - uses: dtolnay/rust-toolchain@stable
      - run: dotnet restore launcher/Launcher.sln
      - run: dotnet build launcher/Launcher.sln --configuration Release --no-restore
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-local-e2e.ps1

  desktop-publish:
    needs: dotnet
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'
      - run: dotnet restore launcher/src/Launcher.App/Launcher.App.csproj --runtime win-x64
      - run: >-
          dotnet publish launcher/src/Launcher.App/Launcher.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output artifacts/vaultnode-win-x64
      - name: Package desktop release
        shell: pwsh
        run: Compress-Archive -Path artifacts/vaultnode-win-x64/* -DestinationPath artifacts/vaultnode-win-x64.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: vaultnode-win-x64
          path: artifacts/vaultnode-win-x64.zip
          if-no-files-found: error
          retention-days: 14
