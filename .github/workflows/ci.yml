name: ci

on:
  push:
  pull_request:

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'
      - run: dotnet restore launcher/Launcher.sln
      - run: dotnet build launcher/Launcher.sln --configuration Release --no-restore
      - run: dotnet test launcher/Launcher.sln --configuration Release --no-build

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
        working-directory: server
      - run: cargo test --workspace
        working-directory: server
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: server

  analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e 'analyzer[dev]'
      - run: ruff check analyzer
      - run: mypy analyzer/src
      - run: pytest analyzer/tests

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - working-directory: website
        run: npm ci
      - working-directory: website
        run: npm run build

  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'
      - uses: dtolnay/rust-toolchain@stable
      - run: dotnet restore launcher/Launcher.sln
      - run: dotnet build launcher/Launcher.sln --configuration Release --no-restore
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-local-e2e.ps1
