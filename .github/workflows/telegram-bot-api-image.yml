name: Build Telegram Local Bot API image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/telegram-bot-api-image.yml"
      - "deploy/telegram-bot-api.Dockerfile"
      - "deploy/telegram-bot-api-entrypoint.sh"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/fe4rlesskirito/game-launcher-telegram-bot-api
  TELEGRAM_BOT_API_REF: adfd7f6a8e990272851777eeb3ae0def4216f161

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/telegram-bot-api.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            TELEGRAM_BOT_API_REF=${{ env.TELEGRAM_BOT_API_REF }}
            TELEGRAM_BOT_API_BUILD_PARALLELISM=2
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
