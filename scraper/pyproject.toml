[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "launcher-scraper"
version = "0.1.0"
description = "Bounded, validated server-side release scraper for Vaultnode ingestion"
requires-python = ">=3.12"
dependencies = ["blake3>=1.0"]

[project.optional-dependencies]
browser = ["playwright>=1.50"]
dev = ["pytest>=8.4", "ruff>=0.12", "mypy>=1.17"]

[project.scripts]
launcher-scraper = "launcher_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
